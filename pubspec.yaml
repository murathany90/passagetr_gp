name: passagetr_gp
description: Public, static PASSAGETR word and reading practice for GitHub Pages.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_tts: ^4.2.3
  go_router: ^16.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/v1/
    - assets/content/v1/words/
    - assets/content/v1/readings/
    - assets/content/v1/readings/items/
